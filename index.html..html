<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1E6FE8"><title>Riidz Note</title>

<style>

.tr{text-align:right;font-weight:800}

.bt{display:flex;gap:12px;margin-top:6px}

.b1{border:2px solid var(--pri);background:none;color:var(--pri)}.b2{border:0;background:linear-gradient(135deg,#3D9BFF,#0A5AD6);color:#fff;box-shadow:0 8px 18px rgba(30,111,232,.35)}

.big{font-size:32px;font-weight:800;margin:6px 0 2px;letter-spacing:-.5px}
.lb{font-size:12px;letter-spacing:2px;font-weight:700;color:var(--pri);margin-bottom:10px}
.st{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.st:first-of-type{border-top:0}.st>div{flex:1}.st b{display:block;font-size:15px}
.ico{width:46px;height:46px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--pri);flex:none}
.sw{width:56px;height:32px;border-radius:16px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:.2s}
.sw.on{background:var(--pri)}.sw.on:after{left:27px}

.lg .on{border-color:#2AA8F0;background:rgba(42,168,240,.12);color:var(--pri)}
.fl{width:26px;height:18px;border-radius:3px;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.wm{text-align:center;margin:28px 0 8px;font:800 24px Unbounded,sans-serif;letter-spacing:1px}.wm span{color:var(--pri)}
.ft{text-align:center;font-size:12px;color:var(--mut)}
.em{text-align:center;color:var(--mut);padding:18px 0 6px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-radius:24px 24px 0 0;padding:10px 6px calc(env(safe-area-inset-bottom,0px) + 8px);box-shadow:0 -6px 22px rgba(30,111,232,.14);z-index:5}

nav .on{color:var(--pri);font-weight:800}nav .on:after{content:"";position:absolute;bottom:0;width:34px;height:3px;border-radius:2px;background:var(--pri)}
dialog{border:0;border-radius:24px;padding:20px;width:calc(100% - 28px);max-width:440px;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}

dialog h3{margin-bottom:12px}
textarea{width:100%;height:150px;border:0;border-radius:14px;background:var(--soft);padding:12px;font:12px/1.4 ui-monospace,monospace;resize:none;outline:0}
.bt.s button{padding:11px 6px;font-size:14px;border-radius:14px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);background:#0B2A6B;color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:20;opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
</style></head><body>

<main id="v"></main><nav id="nv"></nav><dialog id="dg"></dialog><div id="toast"></div>
<script>

en:{g1:'Good morning,',g2:'Good afternoon,',g3:'Good evening,',g4:'Good night,',home:'Home',catat:'Add',laporan:'Report',setelan:'Settings',ka:'Opening Cash',km:'Cash In',kk:'Cash Out',sa:'Closing Balance',trb:'This Month\'s Transactions',trx:'transactions',edit:'Edit',out:'Expense',in:'Income',ct:'Add Transaction',cts:'Record your expenses or income easily',tgl:'Date',kat:'Category',jml:'Amount (Rp)',nom:'Enter amount',ket:'Description',ex:'e.g. Groceries, Salary...',batal:'Cancel',simpan:'Save',ring:'Summary',tm:'Total In',tk:'Total Out',pk:'Expenses by Category',rh:'Daily Recap',semua:'All Transactions',kosong:'No transactions this month',peng:'Settings',pengs:'Customize the look and data of Riidz Note',pref:'PREFERENCES',mode:'Display Mode',terang:'Light mode on',gelap:'Dark mode on',bhs:'BAHASA / LANGUAGE',tsk:'TRANSACTIONS',setka:'Set Opening Cash',modal:'Starting cash this month',unduh:'Download Monthly Data',unduhs:'Save this month\'s transactions as a file',imp:'Import Data',imps:'Add data from a file or text',ver:'Version 2.0 · Monthly Finance Notes',perm:'Data is stored permanently on your device',ok:'Saved',salin:'Copy',pilih:'Choose file',impor:'Import',tutup:'Close',hps:'Delete this transaction?',err:'Enter an amount above 0',cp:'Data copied',im:'transactions imported',bad:'Unknown data format',tempel:'Paste data here'}};
const CATS=['Umum','Makan','Transport','Belanja','Tagihan','Hiburan','Lainnya'];
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
let S={tx:[],ko:{},lang:'id',theme:null};
try{Object.assign(S,JSON.parse(localStorage.getItem('riidz2')||'{}'))}catch(e){}

const t=k=>T[S.lang][k]||k,loc=()=>S.lang=='id'?'id-ID':'en-US';

<div class="c bc"><div class="row"><div><small>${t('ka')}</small><b>${rp(m.ka)}</b></div><button class="eb" data-a="ko">${t('edit')}</button></div></div>

<div class="c row"><div class="row" style="gap:14px"><div class="cir sal" style="width:50px;height:50px">${ic('wal',26)}</div><div><div class="sm">${t('sa')}</div><div class="amt" style="font-size:22px">${m.sa<0?'-':''}${rp(m.sa)}</div></div></div></div>
<div class="c"><div class="row" style="margin-bottom:6px"><h3 class="t-pri" style="color:var(--ink)">${t('trb')}</h3><span class="sm">${m.l.length} ${t('trx')}</span></div>${days||`<div class="em">${t('kosong')}</div>`}</div>`}
function catat(){const o=f.t=='out',tb=(k,i,l)=>`<button data-a="ty" data-v="${k}" class="${f.t==k?'on':''}"><em>${ic(i,26)}</em>${l}</button>`;
return`<div class="c"><div class="ph"><button class="ib" style="width:44px;height:44px;border-radius:50%" data-a="nav" data-v="home" aria-label="back">${ic('back')}</button><div style="flex:1"><h2>${t('ct')}</h2><p>${t('cts')}</p></div><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="38" cy="32" r="24" fill="#FFC928"/><rect x="12" y="10" width="34" height="44" rx="7" fill="#fff" stroke="#9CC4FF"/><path d="M20 24h18M20 32h18M20 40h10" stroke="#1E6FE8" stroke-width="3" stroke-linecap="round"/><path d="M34 54l4-12 18-18 8 8-18 18z" fill="#1668E0"/></svg></div></div>
<div class="c tabs">${tb('out','wal',t('out'))}${tb('in','up',t('in'))}</div>
<div class="c"><div class="fr"><i>${ic('cal',26)}</i><div style="flex:1"><label>${t('tgl')}</label><input type="date" data-f="d" value="${f.d}"></div></div>
<div class="fr"><i>${ic('tag',26)}</i><div style="flex:1"><label>${t('kat')}</label><select data-f="c">${CATS.map(c=>`<option ${c==f.c?'selected':''}>${c}</option>`).join('')}</select></div><span class="ch">${ic('chev',18)}</span></div>
<div class="fr"><i>${ic('rp',26)}</i><div style="flex:1"><label>${t('jml')}</label><input data-f="a" inputmode="numeric" placeholder="${t('nom')}" value="${f.a?f.a.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):''}"></div></div>
<div class="fr"><i>${ic('note',26)}</i><div style="flex:1"><label>${t('ket')}</label><input data-f="n" placeholder="${t('ex')}" value="${esc(f.n)}"></div></div>
<div class="bt"><button class="b1" data-a="cancel">${t('batal')}</button><button class="b2" data-a="sv">${t('simpan')}</button></div></div>`}
function lap(){const m=calc(),cat={};m.l.filter(x=>x.t=='out').forEach(x=>cat[x.c]=(cat[x.c]||0)+x.a);
const r=(l,v,c,bg)=>`<div class="rw" style="background:${bg}"><span>${l}</span><b class="${c}">${rp(v)}</b></div>`,days={};m.l.forEach(x=>{const d=days[x.d]=days[x.d]||{i:0,o:0};d[x.t=='in'?'i':'o']+=x.a});
return mon()+`<div class="c"><h3 style="margin-bottom:12px">${t('ring')}</h3>${r(t('ka'),m.ka,'t-pri','rgba(30,111,232,.08)')}${r(t('tm'),m.mi,'t-in','rgba(18,160,92,.09)')}${r(t('tk'),m.mo,'t-out','rgba(229,56,79,.09)')}${r(t('sa'),m.sa,'t-sal','rgba(242,164,19,.12)')}</div>
<div class="c"><h3 style="margin-bottom:10px">${t('pk')}</h3>${Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin-bottom:12px"><div class="row"><span>${esc(k)}</span><b class="t-out">${rp(v)}</b></div><div class="bar"><i style="width:${v/m.mo*100}%"></i></div></div>`).join('')||`<div class="em">${t('kosong')}</div>`}</div>
<div class="c"><h3 style="margin-bottom:6px">${t('rh')}</h3>${Object.keys(days).sort().reverse().map(d=>`<div class="row" style="padding:9px 0;border-top:1px solid var(--line)"><b>${fd(d,{weekday:'short',day:'numeric',month:'short'})}</b><span><span class="t-in">+${rp(days[d].i)}</span> &nbsp; <span class="t-out">-${rp(days[d].o)}</span></span></div>`).join('')||`<div class="em">${t('kosong')}</div>`}</div>
<div class="c"><h3 style="margin-bottom:6px">${t('semua')}</h3>${m.l.map(item).join('')||`<div class="em">${t('kosong')}</div>`}</div>`}
function set(){const fl=(a,b)=>`<span class="fl" style="background:linear-gradient(${a} 50%,${b} 50%)"></span>`,L=dark();
const row=(a,i,h,s,r)=>`<button class="st" data-a="${a}"><div class="ico">${ic(i,24)}</div><div><b>${h}</b><span class="sm">${s}</span></div>${r||''}<span class="sm">${ic('chev',18)}</span></button>`;
return`<div class="ph" style="margin:6px 4px 18px"><div style="flex:1"><h2 style="font-size:30px">${t('peng')}</h2><p>${t('pengs')}</p></div><svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"><rect x="8" y="8" width="64" height="64" rx="18" fill="#DCEBFF" transform="rotate(8 40 40)"/><circle cx="40" cy="40" r="15" fill="none" stroke="#1E6FE8" stroke-width="12" stroke-dasharray="8 6.8"/><circle cx="40" cy="40" r="13" fill="#1E78F0"/><circle cx="40" cy="40" r="6" fill="#DCEBFF"/><circle cx="64" cy="64" r="9" fill="#FFC928"/></svg></div>
<div class="c"><div class="lb">${t('pref')}</div><div class="row"><div class="ico" style="background:linear-gradient(135deg,#FFE9A8,#BFD9FF);font-size:22px">☀</div><div style="flex:1;margin-left:2px"><b style="font-size:16px">${t('mode')}</b><div class="sm">${t(L?'gelap':'terang')}</div></div><button class="sw ${L?'':'on'}" data-a="th" aria-label="${t('mode')}"></button></div></div>
<div class="c"><div class="lb">${t('bhs')}</div><div class="lg"><button data-a="lg" data-v="id" class="${S.lang=='id'?'on':''}">${fl('#E53935','#fff')}Indonesia</button><button data-a="lg" data-v="en" class="${S.lang=='en'?'on':''}">${fl('#1F3C88','#C8102E')}English</button></div></div>
<div class="c"><div class="lb">${t('tsk')}</div>${row('ko','coin',t('setka'),t('modal'),`<b class="t-pri">${rp(S.ko[cur]||0)}</b>`)}${row('exp','dl',t('unduh'),t('unduhs'))}${row('imp','ul',t('imp'),t('imps'))}</div>
<div class="wm">RIIDZ <span>NOTE</span></div><div class="ft">${t('ver')}<br>${t('perm')}</div>`}
function render(){const V={home,catat,laporan:lap,setelan:set};$('#v').innerHTML=(view=='setelan'?'':'')+V[view]();nav();hd()}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
const dg=$('#dg');
function dlg(h){dg.innerHTML=h;dg.showModal()}
function normTx(o){const g=(...k)=>{for(const x of k)if(o[x]!==undefined&&o[x]!=='')return o[x]},lw=o=>(typeof o=='string'?o:'').toLowerCase();let a=Number(String(g('a','jumlah','amount','nominal')||0).replace(/[^\d.-]/g,'').replace(/\.(?=\d{3}\b)/g,'')),ty=lw(g('t','tipe','jenis','type')),n=g('n','keterangan','deskripsi','desc','description','nama')||'',d=String(g('d','tanggal','date')||today()).slice(0,10);
const isIn=/masuk|^in|income|pemasukan|\+/.test(ty);if(a<0){a=-a}if(!a||!/^\d{4}-\d{2}-\d{2}$/.test(d))return null;return{id:Date.now()+Math.random(),t:isIn?'in':'out',d,c:g('c','kategori','category')||'Umum',a,n:String(n)}}
function doImport(txt){let arr=[],ko=null;try{const j=JSON.parse(txt);arr=Array.isArray(j)?j:(j.tx||j.transactions||j.data||j.transaksi||[]);ko=j.ko||null}catch(e){const ln=txt.trim().split(/\r?\n/);if(ln.length>1){const sep=ln[0].includes(';')?';':',',h=ln[0].split(sep).map(s=>s.trim().toLowerCase());arr=ln.slice(1).map(l=>{const c=l.split(sep),o={};h.forEach((k,i)=>o[k]=(c[i]||'').replace(/^"|"$/g,''));return o})}}
const ex=new Set(S.tx.map(x=>[x.d,x.n,x.a,x.t].join('|')));let n=0;arr.forEach(o=>{const x=o&&normTx(o);if(x&&!ex.has([x.d,x.n,x.a,x.t].join('|'))){S.tx.push(x);n++}});if(ko&&typeof ko=='object')Object.assign(S.ko,ko);
if(!n&&!ko){toast(t('bad'));return}save();dg.close();toast(n+' '+t('im'));render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a=='nav'){view=v;scrollTo(0,0);render()}
else if(a=='qc'){f.t=v;view='catat';scrollTo(0,0);render()}
else if(a=='mon'){const[y,m]=cur.split('-').map(Number),d=new Date(y,m-1+Number(v),1);cur=d.getFullYear()+'-'+pad(d.getMonth()+1);render()}
else if(a=='tog'){openD[v]=!openD[v];render()}
else if(a=='ty'){f.t=v;render()}
else if(a=='cancel'){f={t:'out',d:today(),c:'Umum',a:'',n:''};view='home';render()}
else if(a=='sv'){const n=Number(f.a);if(!n){toast(t('err'));return}S.tx.push({id:Date.now(),t:f.t,d:f.d||today(),c:f.c,a:n,n:f.n.trim()});save();cur=(f.d||today()).slice(0,7);f={t:f.t,d:today(),c:'Umum',a:'',n:''};view='home';render();toast(t('ok'))}
else if(a=='del'){if(confirm(t('hps'))){S.tx=S.tx.filter(x=>String(x.id)!=v);save();render()}}
else if(a=='th'){S.theme=dark()?'light':'dark';save();applyTheme();render()}
else if(a=='lg'){S.lang=v;save();document.documentElement.lang=v;render()}
else if(a=='ko')dlg(`<h3>${t('setka')}</h3><div class="fr"><i>${ic('rp',26)}</i><div style="flex:1"><label>${t('modal')}</label><input id="kv" inputmode="numeric" value="${S.ko[cur]||''}"></div></div><div class="bt"><button class="b1" data-a="cl">${t('batal')}</button><button class="b2" data-a="kos">${t('simpan')}</button></div>`);
else if(a=='kos'){S.ko[cur]=Number($('#kv').value.replace(/\D/g,''))||0;save();dg.close();render();toast(t('ok'))}
else if(a=='exp'){const j=JSON.stringify({tx:mtx(),ko:{[cur]:S.ko[cur]||0}},null,1);dlg(`<h3>${t('unduh')}</h3><textarea id="tx" readonly>${esc(j)}</textarea><div class="bt s" style="margin-top:12px"><button class="b1" data-a="cl">${t('tutup')}</button><button class="b1" data-a="cp">${t('salin')}</button><button class="b2" data-a="dlf">${t('unduh').split(' ')[0]}</button></div>`)}
else if(a=='cp'){const x=$('#tx');x.select();try{navigator.clipboard.writeText(x.value)}catch(e){document.execCommand('copy')}toast(t('cp'))}
else if(a=='dlf'){const u=URL.createObjectURL(new Blob([$('#tx').value],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='riidz-note-'+cur+'.json';document.body.appendChild(l);l.click();l.remove()}
else if(a=='imp')dlg(`<h3>${t('imp')}</h3><textarea id="tx" placeholder="${t('tempel')}"></textarea><input type="file" id="fi" accept=".json,.csv,.txt" hidden><div class="bt s" style="margin-top:12px"><button class="b1" data-a="cl">${t('tutup')}</button><button class="b1" data-a="fp">${t('pilih')}</button><button class="b2" data-a="di">${t('impor')}</button></div>`);
else if(a=='fp'){const i=$('#fi');i.onchange=()=>{const r=new FileReader();r.onload=()=>{$('#tx').value=r.result};i.files[0]&&r.readAsText(i.files[0])};i.click()}
else if(a=='di')doImport($('#tx').value);
else if(a=='cl')dg.close()});
document.addEventListener('input',e=>{const k=e.target.dataset.f;if(!k)return;if(k=='a'){const d=e.target.value.replace(/\D/g,'');f.a=d;e.target.value=d.replace(/\B(?=(\d{3})+(?!\d))/g,'.')}else f[k]=e.target.value});
dg.addEventListener('click',e=>{if(e.target==dg)dg.close()});
applyTheme();document.documentElement.lang=S.lang;render();setInterval(hd,30000);
</script></body></html>
